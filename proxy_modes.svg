<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" fill="url(#bg2)" rx="14"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="1">ACTIVE vs PASSIVE PROXY MODES</text>
  <line x1="250" y1="42" x2="650" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- ═══════ ACTIVE MODE (Left) ═══════ -->
  <rect x="25" y="60" width="415" height="220" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="25" y="60" width="415" height="30" rx="10" fill="#166534"/>
  <rect x="25" y="80" width="415" height="10" fill="#166534"/>
  <text x="232" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bbf7d0" letter-spacing="1">✅  ACTIVE MODE (RECOMMENDED)</text>

  <!-- Active: Proxy -->
  <rect x="50" y="110" width="160" height="55" rx="8" fill="#16a34a"/>
  <text x="130" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">🐳 Zabbix Proxy</text>
  <text x="130" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#dcfce7">Client Network</text>

  <!-- Active: Server -->
  <rect x="260" y="110" width="155" height="55" rx="8" fill="#1d4ed8"/>
  <text x="337" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">🖥️ Zabbix Server</text>
  <text x="337" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#bfdbfe">NOC Central</text>

  <!-- Active: Arrow (Proxy → Server) -->
  <line x1="210" y1="137" x2="255" y2="137" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="258,137 250,132 250,142" fill="#4ade80"/>
  <text x="232" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#86efac">PUSH</text>

  <!-- Active: Benefits -->
  <text x="55" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#86efac">✔ Proxy initiates connection to Server port 10051</text>
  <text x="55" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#86efac">✔ No port forwarding needed on client router</text>
  <text x="55" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#86efac">✔ Works behind CGNAT / Dynamic IP</text>
  <text x="55" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#86efac">✔ Buffers data if connection drops (Zero data loss)</text>
  <text x="55" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#4ade80">⭐ Best for: Remote offices, Home networks, Cloud VMs</text>

  <!-- ═══════ PASSIVE MODE (Right) ═══════ -->
  <rect x="460" y="60" width="415" height="220" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="460" y="60" width="415" height="30" rx="10" fill="#92400e"/>
  <rect x="460" y="80" width="415" height="10" fill="#92400e"/>
  <text x="667" y="82" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="1">⚠️  PASSIVE MODE</text>

  <!-- Passive: Server -->
  <rect x="485" y="110" width="155" height="55" rx="8" fill="#1d4ed8"/>
  <text x="562" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">🖥️ Zabbix Server</text>
  <text x="562" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#bfdbfe">NOC Central</text>

  <!-- Passive: Proxy -->
  <rect x="695" y="110" width="155" height="55" rx="8" fill="#d97706"/>
  <text x="772" y="133" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff">🐳 Zabbix Proxy</text>
  <text x="772" y="152" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#fef3c7">Client Network</text>

  <!-- Passive: Arrow (Server → Proxy) -->
  <line x1="645" y1="137" x2="690" y2="137" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="693,137 685,132 685,142" fill="#fbbf24"/>
  <text x="667" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="600" fill="#fde68a">PULL</text>

  <!-- Passive: Benefits -->
  <text x="490" y="190" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#fcd34d">✔ Server pulls data from Proxy port 10051</text>
  <text x="490" y="206" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#fcd34d">✔ Server has full control over data collection</text>
  <text x="490" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#ef4444">✖ Requires public/static IP on Proxy side</text>
  <text x="490" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#ef4444">✖ Requires port forwarding on client router</text>
  <text x="490" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#fbbf24">⭐ Best for: Data centers with static public IPs</text>
</svg>
