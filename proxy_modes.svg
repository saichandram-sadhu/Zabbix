<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="920" height="340" fill="url(#bg2)" rx="14"/>

  <!-- Title -->
  <text x="460" y="30" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="2">ZABBIX PROXY MODES — ACTIVE vs PASSIVE</text>
  <line x1="220" y1="42" x2="700" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- ═══════════════════════════════════ -->
  <!-- LEFT: ACTIVE MODE (Recommended)    -->
  <!-- ═══════════════════════════════════ -->
  <rect x="20" y="58" width="430" height="262" rx="12" fill="none" stroke="#22c55e" stroke-width="2"/>
  <rect x="20" y="58" width="430" height="32" rx="12" fill="#166534"/>
  <rect x="20" y="78" width="430" height="12" fill="#166534"/>
  <text x="235" y="80" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#bbf7d0" letter-spacing="1.5">✅  ACTIVE MODE  (RECOMMENDED)</text>

  <!-- Active: Proxy Box -->
  <rect x="45" y="108" width="170" height="58" rx="8" fill="#16a34a"/>
  <text x="130" y="134" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">🐳 Zabbix Proxy</text>
  <text x="130" y="152" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#dcfce7">Client Network</text>

  <!-- Active: Server Box -->
  <rect x="265" y="108" width="170" height="58" rx="8" fill="#1d4ed8"/>
  <text x="350" y="134" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">🖥️ Zabbix Server</text>
  <text x="350" y="152" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#bfdbfe">NOC Central</text>

  <!-- Active: Animated arrow Proxy → Server -->
  <line x1="215" y1="137" x2="260" y2="137" stroke="#4ade80" stroke-width="2"/>
  <polygon points="263,137 255,132 255,142" fill="#4ade80"/>
  <text x="238" y="130" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#86efac">PUSH</text>

  <!-- Active: Animated data dot -->
  <circle r="4" fill="#4ade80">
    <animate attributeName="cx" values="215;258" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;137" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Active: Benefits list -->
  <text x="50" y="192" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#86efac">✔  Proxy initiates connection to Server</text>
  <text x="50" y="212" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#86efac">✔  No port forwarding needed on client router</text>
  <text x="50" y="232" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#86efac">✔  Works behind CGNAT / Dynamic IP</text>
  <text x="50" y="252" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#86efac">✔  Buffers data on disconnect (Zero data loss)</text>

  <!-- Active: Best For -->
  <rect x="45" y="268" width="390" height="30" rx="6" fill="#14532d" opacity="0.6"/>
  <text x="240" y="288" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#4ade80">⭐  Best for: Remote offices, Home networks, Cloud VMs</text>

  <!-- ═══════════════════════════════════ -->
  <!-- RIGHT: PASSIVE MODE                -->
  <!-- ═══════════════════════════════════ -->
  <rect x="470" y="58" width="430" height="262" rx="12" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <rect x="470" y="58" width="430" height="32" rx="12" fill="#78350f"/>
  <rect x="470" y="78" width="430" height="12" fill="#78350f"/>
  <text x="685" y="80" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fde68a" letter-spacing="1.5">⚠️  PASSIVE MODE</text>

  <!-- Passive: Server Box -->
  <rect x="495" y="108" width="170" height="58" rx="8" fill="#1d4ed8"/>
  <text x="580" y="134" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">🖥️ Zabbix Server</text>
  <text x="580" y="152" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#bfdbfe">NOC Central</text>

  <!-- Passive: Proxy Box -->
  <rect x="715" y="108" width="170" height="58" rx="8" fill="#b45309"/>
  <text x="800" y="134" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">🐳 Zabbix Proxy</text>
  <text x="800" y="152" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" fill="#fef3c7">Client Network</text>

  <!-- Passive: Animated arrow Server → Proxy -->
  <line x1="665" y1="137" x2="710" y2="137" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="713,137 705,132 705,142" fill="#fbbf24"/>
  <text x="688" y="130" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="9" font-weight="700" fill="#fde68a">PULL</text>

  <!-- Passive: Animated data dot -->
  <circle r="4" fill="#fbbf24">
    <animate attributeName="cx" values="665;708" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="137;137" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Passive: Benefits/Drawbacks list -->
  <text x="500" y="192" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#fcd34d">✔  Server pulls data from Proxy</text>
  <text x="500" y="212" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#fcd34d">✔  Server has full collection control</text>
  <text x="500" y="232" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#f87171">✖  Requires public/static IP on Proxy side</text>
  <text x="500" y="252" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#f87171">✖  Requires port forwarding on client router</text>

  <!-- Passive: Best For -->
  <rect x="495" y="268" width="390" height="30" rx="6" fill="#451a03" opacity="0.6"/>
  <text x="690" y="288" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fbbf24">⭐  Best for: Data centers with static public IPs</text>
</svg>
