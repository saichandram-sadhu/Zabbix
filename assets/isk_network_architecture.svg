<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background: #0B0F19; font-family: 'Inter', sans-serif;">
  <defs>
    <!-- Glowing Shadow Filter -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="noc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="proxy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="win-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#F3F4F6" font-size="22" font-weight="700" letter-spacing="1">ISK CLIENT MONITORING TOPOLOGY</text>
  <text x="500" y="65" text-anchor="middle" fill="#9CA3AF" font-size="14">Secure Headscale VPN Mesh + Agentless SNMP Relay</text>

  <!-- Network Areas -->
  <!-- NOC Group -->
  <rect x="50" y="110" width="380" height="340" rx="16" fill="#111827" stroke="#1F2937" stroke-width="2" />
  <text x="240" y="140" text-anchor="middle" fill="#9CA3AF" font-size="14" font-weight="600" letter-spacing="0.5">HYDERABAD NOC SERVER (CENTRAL)</text>

  <!-- Client Group -->
  <rect x="570" y="110" width="380" height="340" rx="16" fill="#111827" stroke="#1F2937" stroke-width="2" />
  <text x="760" y="140" text-anchor="middle" fill="#9CA3AF" font-size="14" font-weight="600" letter-spacing="0.5">ISK REMOTE OFFICE LAN</text>

  <!-- Connections -->
  <!-- Encrypted Tunnel Line -->
  <path d="M 330 250 L 670 250" stroke="url(#line-grad)" stroke-width="5" stroke-dasharray="10 5" filter="url(#glow-teal)" />
  <!-- Local SNMP Query Link -->
  <path d="M 760 290 L 760 370" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5 3" />

  <!-- Labels on Tunnel -->
  <rect x="420" y="225" width="160" height="50" rx="8" fill="#1F2937" stroke="#374151" />
  <text x="500" y="244" text-anchor="middle" fill="#F3F4F6" font-size="11" font-weight="600">Tailscale Encrypted Tunnel</text>
  <text x="500" y="264" text-anchor="middle" fill="#10B981" font-size="10" font-weight="700">WireGuard P2P Protocol</text>

  <!-- Nodes -->
  <!-- 1. Central Zabbix NOC Server -->
  <g transform="translate(90, 170)">
    <rect x="0" y="0" width="240" height="100" rx="12" fill="url(#noc-grad)" filter="url(#glow-teal)" />
    <text x="20" y="30" fill="#FFFFFF" font-size="15" font-weight="700">Zabbix Server &amp; Headscale</text>
    <text x="20" y="55" fill="#E0F2FE" font-size="12">Public IP: 122.170.96.200</text>
    <text x="20" y="75" fill="#E0F2FE" font-size="12">VPN IP: 100.64.0.2 (Port 10051)</text>
  </g>
  
  <!-- Central Router Symbol -->
  <g transform="translate(190, 310)">
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#1F2937" stroke="#0D9488" stroke-width="2" />
    <text x="80" y="25" text-anchor="middle" fill="#E5E7EB" font-size="12" font-weight="600">Central ISP Router</text>
    <text x="80" y="50" text-anchor="middle" fill="#9CA3AF" font-size="10">Forward TCP 8080 (Login)</text>
    <text x="80" y="70" text-anchor="middle" fill="#9CA3AF" font-size="10">Forward UDP 41641 (P2P)</text>
  </g>

  <!-- 2. Client Zabbix Proxy -->
  <g transform="translate(670, 180)">
    <rect x="0" y="0" width="240" height="110" rx="12" fill="url(#proxy-grad)" filter="url(#glow-purple)" />
    <text x="20" y="30" fill="#FFFFFF" font-size="15" font-weight="700">Zabbix Proxy VM</text>
    <text x="20" y="55" fill="#F5F3FF" font-size="12">OS: Ubuntu Server 22.04</text>
    <text x="20" y="75" fill="#F5F3FF" font-size="12">Local IP: 192.168.10.50</text>
    <text x="20" y="95" fill="#F5F3FF" font-size="12">VPN IP: 100.64.0.3 (Active Mode)</text>
  </g>
  
  <!-- 3. Client Windows Server (Agentless) -->
  <g transform="translate(670, 320)">
    <rect x="0" y="0" width="240" height="100" rx="12" fill="url(#win-grad)" />
    <text x="20" y="30" fill="#FFFFFF" font-size="14" font-weight="700">Windows Server (AD/DB)</text>
    <text x="20" y="55" fill="#FEF3C7" font-size="12">Agent Status: Agentless</text>
    <text x="20" y="75" fill="#FEF3C7" font-size="12">Local IP: 192.168.10.100</text>
    <text x="20" y="92" fill="#F59E0B" font-size="10" font-weight="700">Monitoring via SNMP Port 161</text>
  </g>
</svg>
