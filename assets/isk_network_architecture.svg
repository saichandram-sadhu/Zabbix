<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <style>
    @keyframes flow-right {
      0% { stroke-dashoffset: 30; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow-down {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dot-move-right {
      0% { transform: translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(280px); opacity: 0; }
    }
    @keyframes dot-move-up {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-120px); opacity: 0; }
    }
    @keyframes blink-green {
      0%, 100% { fill: #22C55E; }
      50% { fill: #166534; }
    }
    .flow-line-h { stroke-dasharray: 8 6; animation: flow-right 1s linear infinite; }
    .flow-line-v { stroke-dasharray: 6 4; animation: flow-down 0.8s linear infinite; }
    .led { animation: blink-green 2s ease-in-out infinite; }
    .packet-h { animation: dot-move-right 3s ease-in-out infinite; }
    .packet-v { animation: dot-move-up 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1100" height="700" rx="12" fill="#0F172A" />

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="24" font-weight="800">ISK Client — Network Monitoring Architecture</text>
  <text x="550" y="68" text-anchor="middle" fill="#64748B" font-family="system-ui, sans-serif" font-size="14">Headscale VPN Tunnel + Agentless SNMP Monitoring via Zabbix Proxy</text>

  <!-- ==================== LEFT SIDE: HYDERABAD NOC ==================== -->
  <rect x="40" y="95" width="440" height="560" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="40" y="95" width="440" height="40" rx="16" fill="#0D9488" />
  <rect x="40" y="120" width="440" height="15" fill="#0D9488" />
  <text x="260" y="122" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">HYDERABAD NOC (Your Office)</text>

  <!-- Zabbix Server Card -->
  <rect x="80" y="160" width="360" height="130" rx="12" fill="#134E4A" stroke="#2DD4BF" stroke-width="1.5" />
  <circle cx="110" cy="185" r="6" class="led" />
  <text x="122" y="190" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ONLINE</text>
  <text x="100" y="215" fill="#F0FDFA" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Zabbix Server (Central NOC)</text>
  <text x="100" y="240" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="13">Public IP: 122.170.96.200</text>
  <text x="100" y="260" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="13">VPN IP: 100.64.0.2</text>
  <text x="100" y="280" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Listens on Port 10051 (VPN Only)</text>

  <!-- Headscale VPN Controller Card -->
  <rect x="80" y="310" width="360" height="100" rx="12" fill="#1E3A5F" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="110" cy="335" r="6" class="led" />
  <text x="122" y="340" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ONLINE</text>
  <text x="100" y="365" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Headscale VPN Controller</text>
  <text x="100" y="390" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="13">Port 8080 (Client Registration)</text>

  <!-- Router Card -->
  <rect x="80" y="430" width="360" height="110" rx="12" fill="#1C1917" stroke="#78716C" stroke-width="1.5" />
  <text x="100" y="460" fill="#E7E5E4" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ISP Router (NAT Gateway)</text>
  <text x="100" y="485" fill="#A8A29E" font-family="system-ui, sans-serif" font-size="12">Port Forward Rules:</text>
  <rect x="100" y="495" width="150" height="22" rx="6" fill="#292524" />
  <text x="175" y="511" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TCP 8080 ➜ 192.168.1.178</text>
  <rect x="260" y="495" width="160" height="22" rx="6" fill="#292524" />
  <text x="340" y="511" text-anchor="middle" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UDP 41641 ➜ 192.168.1.178</text>

  <!-- Vertical connectors inside NOC -->
  <line x1="260" y1="290" x2="260" y2="310" stroke="#2DD4BF" stroke-width="2" />
  <line x1="260" y1="410" x2="260" y2="430" stroke="#78716C" stroke-width="2" />

  <!-- ==================== RIGHT SIDE: ISK REMOTE OFFICE ==================== -->
  <rect x="620" y="95" width="440" height="560" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="620" y="95" width="440" height="40" rx="16" fill="#7C3AED" />
  <rect x="620" y="120" width="440" height="15" fill="#7C3AED" />
  <text x="840" y="122" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="700">ISK CLIENT OFFICE (Remote Site)</text>

  <!-- Proxy VM Card -->
  <rect x="660" y="160" width="360" height="150" rx="12" fill="#2E1065" stroke="#A78BFA" stroke-width="1.5" />
  <circle cx="690" cy="185" r="6" class="led" />
  <text x="702" y="190" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ONLINE</text>
  <text x="680" y="215" fill="#F5F3FF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Zabbix Proxy VM (Active Mode)</text>
  <text x="680" y="240" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="13">OS: Ubuntu 22.04 LTS</text>
  <text x="680" y="260" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="13">Local IP: 192.168.10.50</text>
  <text x="680" y="280" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="13">VPN IP: 100.64.0.3</text>
  <text x="680" y="300" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Hardware: 2 vCPU | 2GB RAM | 20GB SSD</text>

  <!-- Windows Server Card (Agentless) -->
  <rect x="660" y="380" width="360" height="130" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1.5" />
  <text x="680" y="410" fill="#FEF3C7" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Windows Server (Agentless)</text>
  <text x="680" y="435" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13">Local IP: 192.168.10.100</text>
  <text x="680" y="455" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13">Protocol: SNMP v2c (Port 161)</text>
  <text x="680" y="475" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="13">Community: isk_noc_public</text>
  <rect x="680" y="485" width="180" height="18" rx="6" fill="#78350F" />
  <text x="770" y="498" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="800">NO AGENT INSTALLED</text>

  <!-- Vertical SNMP Link between Proxy and Windows -->
  <line x1="840" y1="310" x2="840" y2="380" stroke="#F59E0B" stroke-width="3" class="flow-line-v" />
  <!-- SNMP Label -->
  <rect x="855" y="332" width="105" height="24" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
  <text x="907" y="349" text-anchor="middle" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SNMP Polling</text>
  <!-- Animated SNMP packet going up -->
  <circle cx="840" cy="375" r="5" fill="#FBBF24" class="packet-v" />

  <!-- ==================== CENTER: VPN TUNNEL ==================== -->
  <!-- Main Tunnel Line -->
  <line x1="440" y1="220" x2="660" y2="220" stroke="#3B82F6" stroke-width="4" class="flow-line-h" />

  <!-- Tunnel Label Box -->
  <rect x="470" y="195" width="160" height="50" rx="10" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5" />
  <text x="550" y="216" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="11" font-weight="800">WireGuard Tunnel</text>
  <text x="550" y="236" text-anchor="middle" fill="#22C55E" font-family="system-ui, sans-serif" font-size="10" font-weight="700">AES-256 Encrypted</text>

  <!-- Animated Data Packet Dot Moving Right -->
  <circle cx="445" cy="220" r="6" fill="#60A5FA" class="packet-h" />

  <!-- ==================== STEP FLOW NUMBERS ==================== -->
  <!-- Step 1: Windows sends SNMP data to Proxy -->
  <g transform="translate(660, 535)">
    <circle cx="15" cy="15" r="15" fill="#F59E0B" />
    <text x="15" y="20" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="900">1</text>
    <text x="38" y="20" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Proxy polls Windows via SNMP (LAN)</text>
  </g>
  <!-- Step 2: Proxy sends data to NOC via Tunnel -->
  <g transform="translate(660, 565)">
    <circle cx="15" cy="15" r="15" fill="#8B5CF6" />
    <text x="15" y="20" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="900">2</text>
    <text x="38" y="20" fill="#DDD6FE" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Proxy relays data via VPN tunnel</text>
  </g>
  <!-- Step 3: NOC receives & displays -->
  <g transform="translate(660, 595)">
    <circle cx="15" cy="15" r="15" fill="#14B8A6" />
    <text x="15" y="20" text-anchor="middle" fill="#0F172A" font-family="system-ui, sans-serif" font-size="14" font-weight="900">3</text>
    <text x="38" y="20" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Zabbix Server displays live dashboard</text>
  </g>

  <!-- Step labels on NOC side -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="360" height="60" rx="10" fill="#042F2E" stroke="#14B8A6" stroke-width="1" />
    <text x="180" y="22" text-anchor="middle" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="12" font-weight="800">SECURITY NOTE</text>
    <text x="180" y="42" text-anchor="middle" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11">Port 10051 is CLOSED to public internet.</text>
    <text x="180" y="56" text-anchor="middle" fill="#99F6E4" font-family="system-ui, sans-serif" font-size="11">Only VPN peers (100.64.0.0/10) can reach it.</text>
  </g>
</svg>
